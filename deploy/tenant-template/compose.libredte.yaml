# Overlay de compatibilidad para tenants creados antes de incorporar LibreDTE a
# compose.yaml. deploy-all.sh lo aplica automáticamente cuando el compose local
# del tenant todavía no declara el servicio libredte.
services:
  api:
    environment:
      LibreDte__BaseUrl: http://libredte:80
      LibreDte__TimeoutSeconds: ${LIBREDTE_TIMEOUT_SECONDS:-60}
    depends_on:
      - libredte

  libredte:
    image: ${LIBREDTE_IMAGE:-ghcr.io/libredte/libredte-lib-core-api@sha256:a953e36b3a3fa1f6b570834d19511dd0a674e2ede66f0b7b8a0004579ad21587}
    restart: unless-stopped
    environment:
      APP_URL: http://libredte
    networks:
      - internal
