name: Build & Deploy

# Cada push a main construye las imagenes una sola vez, las publica en GHCR y
# despliega en todos los servidores declarados en DEPLOY_ENVIRONMENTS.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestana Actions

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/sebaberrios2097/sgal-app-api
  IMAGE_WEB: ghcr.io/sebaberrios2097/sgal-app-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # para publicar en GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      # Si un servidor falla, los demas igualmente intentan desplegar.
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(vars.DEPLOY_ENVIRONMENTS) }}
    name: Deploy (${{ matrix.environment }})
    # Cada GitHub Environment contiene los secretos SSH de un solo servidor.
    environment:
      name: ${{ matrix.environment }}
    steps:
      - name: Desplegar en ${{ matrix.environment }} por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            # Token efimero: no queda guardado en el repositorio ni en el .env.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ secrets.DEPLOY_PATH }}
            # Actualiza scripts y compose; los .env locales estan ignorados por Git.
            git pull --ff-only
            # Actualiza todas las instancias existentes solo en este servidor.
            bash deploy/deploy-all.sh
            docker logout ghcr.io
