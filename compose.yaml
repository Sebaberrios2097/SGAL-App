services:
  api:
    image: ghcr.io/sebaberrios2097/sgal-app-api:${API_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    networks:
      - sgal

  web:
    image: ghcr.io/sebaberrios2097/sgal-app-web:${WEB_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${APP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - sgal

networks:
  sgal:
    driver: bridge
