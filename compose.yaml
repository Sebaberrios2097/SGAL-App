services:
  api:
    image: ghcr.io/sebaberrios2097/sietevidasapi-api:${API_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - sietevidas

  web:
    image: ghcr.io/sebaberrios2097/sietevidas-frontend:${WEB_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${APP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - sietevidas

networks:
  sietevidas:
    driver: bridge
