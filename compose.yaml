services:
  api:
    image: ghcr.io/sebaberrios2097/sgal-app-api:${API_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DataProtection__KeysPath: /app/dp-keys
      LibreDte__BaseUrl: http://libredte:80
      LibreDte__TimeoutSeconds: ${LIBREDTE_TIMEOUT_SECONDS:-60}
    volumes:
      - api-data-protection:/app/dp-keys
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    networks:
      - sgal
    depends_on:
      - libredte

  libredte:
    image: ${LIBREDTE_IMAGE:-ghcr.io/libredte/libredte-lib-core-api@sha256:a953e36b3a3fa1f6b570834d19511dd0a674e2ede66f0b7b8a0004579ad21587}
    restart: unless-stopped
    environment:
      APP_URL: http://libredte
    networks:
      - sgal

  web:
    image: ghcr.io/sebaberrios2097/sgal-app-web:${WEB_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${APP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - sgal

networks:
  sgal:
    driver: bridge

volumes:
  api-data-protection:
